services:
  - type: web
    name: intelligent-document-qa-rag
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120"
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMBEDDING_BACKEND
        value: gemini
      - key: TABLE_PARSER_BACKEND
        value: api
      - key: TOP_K
        value: "5"
      - key: PYTHON_VERSION
        value: "3.10.6"
    disk:
      name: docqa-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
